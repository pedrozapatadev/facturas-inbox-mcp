# Lists the npm package in the official MCP Registry (registry.modelcontextprotocol.io).
# The registry stores metadata only; publish the npm version first, bump the two
# "version" fields in server.json to match, then run this workflow.
name: Publish to MCP Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login: no secrets needed
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches package.json
        run: |
          node -e '
            const p = require("./package.json"), s = require("./server.json");
            if (s.name !== p.mcpName) throw new Error(`name ${s.name} != mcpName ${p.mcpName}`);
            if (s.version !== p.version || s.packages[0].version !== p.version) throw new Error(`server.json version != package.json ${p.version}`);
          '
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
