name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test with MCP Inspector CLI
        if: matrix.node == 24
        run: npx -y @modelcontextprotocol/inspector --cli node dist/index.js examples/inbox --method tools/list | grep -q '"vat_summary"'
